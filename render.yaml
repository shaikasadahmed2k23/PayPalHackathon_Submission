# Render Blueprint: one free web service (API) + one free STATIC SITE (frontend). Static sites don't use the 750
# free instance hours and never spin down. Secrets use sync:false (you paste them in the dashboard).
services:
  - type: web
    name: leashpay-api
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_FALLBACK
        value: groq
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MERCHANT_PAYOUT_EMAIL
        sync: false
      - key: SERVER_SIGNING_KEY
        sync: false
      - key: FRONTEND_URL  # where PayPal sends the buyer back (the static site)
        value: https://leashpay.onrender.com
      - key: CORS_ORIGINS  # new static site + the old leashpay-web during the switch (remove it afterwards)
        value: https://leashpay.onrender.com,https://leashpay-web.onrender.com

  - type: web
    name: leashpay
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: out
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NEXT_PUBLIC_API_URL  # build-time: change it, then redeploy the site
        sync: false
    headers:
      # Never serve a stale shell: HTML, the service worker and the manifest are revalidated every time.
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /wallet/*
        name: Cache-Control
        value: no-cache
      - path: /merchant/*
        name: Cache-Control
        value: no-cache
      - path: /setup/*
        name: Cache-Control
        value: no-cache
      - path: /agent/*
        name: Cache-Control
        value: no-cache
      - path: /dashboard/*
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      # Hashed build output never changes.
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
